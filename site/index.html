<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RennovaAI</title>
<meta name="description" content="RennovaAI: AI room previews, renovation estimates and verified local vendors in Pakistan.">
<style>
  :root { --teal:#0AB49A; --navy:#00275B; --text:#0B1E3F; --muted:#5B6B82; --bg:#F7F9FB; --card:#FFFFFF; --line:#E3E9F0; }
  @media (prefers-color-scheme: dark) { :root { --text:#E8EEF6; --muted:#9FB0C6; --bg:#0B1524; --card:#122036; --line:#22324A; --navy:#E8EEF6; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:56px 16px 64px; text-align:center; }
  img { width:96px; height:96px; border-radius:24px; }
  h1 { margin:16px 0 4px; font-size:28px; color:var(--navy); }
  p { margin:0 0 28px; color:var(--muted); }
  nav { display:grid; gap:12px; text-align:left; }
  a { display:block; padding:16px 18px; border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--text); text-decoration:none; font-weight:600; }
  a span { display:block; font-weight:400; font-size:14px; color:var(--muted); }
  a:hover, a:focus-visible { border-color:var(--teal); outline:none; }
</style>
</head>
<body>
<main>
  <img src="/icon.png" alt="RennovaAI logo">
  <h1>RennovaAI</h1>
  <p>See it before you build it: AI room previews, renovation estimates and verified local vendors.</p>
  <nav>
    <a href="/privacy">Privacy policy<span>What we collect, why, and how to delete it</span></a>
    <a href="/terms">Terms of use<span>The rules for using RennovaAI</span></a>
    <a href="/privacy#delete-account">Delete your account<span>Remove your account and data</span></a>
  </nav>
</main>
</body>
</html>
